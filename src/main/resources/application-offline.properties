# Offline POS Terminal Profile
# Run with: --spring.profiles.active=offline
# Each POS terminal runs its own embedded Spring Boot with H2

spring.application.name=POS-Terminal

# H2 local database (file-based, survives restarts)
# Directory: ./pos-data/ (created automatically on first run)
spring.datasource.url=jdbc:h2:file:./pos-data/terminal;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.id.new_generator_mappings=true

server.port=${SERVER_PORT:9090}

jwt.secret=6b7a8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f
jwt.expiration=86400000

pos.security.csrf-enabled=false

# Sync to central server
pos.sync.mode=offline
pos.sync.central-url=${CENTRAL_URL:http://localhost:9090}
pos.sync.api-key=${API_KEY:}
pos.sync.poll-interval-seconds=15

# Disable RabbitMQ when offline
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.rabbit.enabled=false

# Rate limiting (light touch for local terminal)
pos.rate-limit.enabled=false
