# Local pharmacy node profile
# Run with: --spring.profiles.active=offline
# The local and hosted modes deliberately use the same PostgreSQL migrations.

spring.application.name=POS-Local-Node
pos.sync.mode=local
pos.features.offline=true
pos.seed.demo-enabled=${POS_SEED_DEMO_ENABLED:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false
management.health.rabbit.enabled=false

pos.rate-limit.enabled=${POS_RATE_LIMIT_ENABLED:false}
