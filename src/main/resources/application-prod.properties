# Production Profile
# Run with: --spring.profiles.active=prod
# Overrides insecure defaults from application.properties

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.format_sql=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

# Security: CSRF enabled in production
pos.security.csrf-enabled=true

# Compliance: switch to SANDBOX or PRODUCTION when KRA-certified
compliance.mode=MOCK
compliance.strict-validation=true

# Feature flags
pos.features.email=true
pos.features.sms=true
pos.features.fiscal=true
pos.features.payment=true
pos.features.devices=true
pos.features.offline=false

# Fiscal: LOCAL for certification, REMOTE for extracted service
pos.fiscal.enabled=true
pos.fiscal.mode=LOCAL

# Rate Limiting
pos.rate-limit.enabled=true
pos.rate-limit.requests-per-second=30
pos.rate-limit.auth-requests-per-second=3

# Actuator: restrict in prod
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=WARN
logging.level.com.example.pos=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
