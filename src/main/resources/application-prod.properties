# Production Profile
# Run with: --spring.profiles.active=prod
# All secrets and allowed origins must be supplied through environment variables.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.format_sql=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

# Security
pos.security.csrf-enabled=true
server.servlet.session.cookie.name=__Host-pos_session
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.path=/
pos.seed.demo-enabled=false

# Compliance: switch to SANDBOX or PRODUCTION when KRA-certified
compliance.mode=MOCK
compliance.strict-validation=true

# Feature flags
pos.features.email=${POS_FEATURES_EMAIL:false}
pos.features.sms=${POS_FEATURES_SMS:false}
pos.features.fiscal=${POS_FEATURES_FISCAL:false}
pos.features.payment=true
pos.features.devices=${POS_FEATURES_DEVICES:true}
pos.features.offline=false

# Fiscal: LOCAL for certification, REMOTE for extracted service
pos.fiscal.enabled=${POS_FISCAL_ENABLED:false}
pos.fiscal.mode=LOCAL

# Rate Limiting
pos.rate-limit.enabled=true
pos.rate-limit.requests-per-second=30
pos.rate-limit.auth-requests-per-second=3

# Actuator: restrict in prod
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=WARN
logging.level.com.example.pos=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
