spring.application.name=POS
spring.jackson.time-zone=${POS_TIMEZONE:Africa/Nairobi}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pos}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000

# JPA and migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Server-side session authentication
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${POS_SESSION_IDLE_TIMEOUT:30m}
server.servlet.session.timeout=${POS_SESSION_IDLE_TIMEOUT:30m}
server.servlet.session.cookie.name=${POS_SESSION_COOKIE_NAME:pos_session}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${POS_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${POS_SESSION_COOKIE_SAME_SITE:strict}
server.servlet.session.cookie.path=/
server.forward-headers-strategy=framework
pos.security.csrf-enabled=true
pos.security.absolute-session-timeout=${POS_SESSION_ABSOLUTE_TIMEOUT:12h}
pos.security.allowed-origins=${POS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

# Server
server.port=${SERVER_PORT:9090}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.health.rabbit.enabled=false

# Optional SMTP integration
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}

# Optional RabbitMQ integration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Optional payment integrations. Keep credentials outside source control.
mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
mpesa.passkey=${MPESA_PASSKEY:}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.environment=${MPESA_ENVIRONMENT:sandbox}
mpesa.callback-url=${MPESA_CALLBACK_URL:http://localhost:9090/api/v1/payments/mpesa/callback}
mpesa.callback-hmac-key=${MPESA_CALLBACK_HMAC_KEY:}
mpesa.callback-replay-window-seconds=300
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.base-url=https://api.stripe.com
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:9090/api/v1/payments/paystack/callback}
paystack.subaccount=${PAYSTACK_SUBACCOUNT:}

# MVP feature flags
pos.features.fiscal=${POS_FEATURES_FISCAL:false}
pos.features.payment=${POS_FEATURES_PAYMENT:true}
pos.features.devices=${POS_FEATURES_DEVICES:true}
pos.features.offline=${POS_FEATURES_OFFLINE:false}
pos.features.email=${POS_FEATURES_EMAIL:false}
pos.features.sms=${POS_FEATURES_SMS:false}
pos.seed.demo-enabled=${POS_SEED_DEMO_ENABLED:true}

# Hybrid sync is opt-in. Local mode never requires internet for checkout.
pos.sync.mode=${POS_SYNC_MODE:local}
pos.sync.central-url=${POS_SYNC_CENTRAL_URL:http://localhost:9090}
pos.sync.poll-interval-seconds=${POS_SYNC_POLL_INTERVAL_SECONDS:30}
pos.sales.return-window-days=${POS_SALES_RETURN_WINDOW_DAYS:7}

# Compliance and fiscal integrations are outside the MVP checkout path.
compliance.mode=${COMPLIANCE_MODE:MOCK}
compliance.kra-pin=${COMPLIANCE_KRA_PIN:}
compliance.device-serial=${COMPLIANCE_DEVICE_SERIAL:}
compliance.active-provider=${COMPLIANCE_ACTIVE_PROVIDER:OSCU}
compliance.strict-validation=${COMPLIANCE_STRICT_VALIDATION:false}
compliance.log-full-payloads=false
compliance.max-retry-attempts=10
compliance.retry-interval-ms=60000
compliance.osuc.api-url=${COMPLIANCE_OSCU_API_URL:}
compliance.osuc.timeout-seconds=30
compliance.vscu.api-url=${COMPLIANCE_VSCU_API_URL:}
compliance.vscu.timeout-seconds=30
pos.fiscal.enabled=${POS_FISCAL_ENABLED:false}
pos.fiscal.mode=${POS_FISCAL_MODE:LOCAL}
pos.fiscal.remote-url=${POS_FISCAL_REMOTE_URL:http://fiscal-service:8081}
pos.fiscal.api-key=${FISCAL_API_KEY:}
pos.fiscal.retry.max-attempts=5
pos.fiscal.retry.initial-backoff-ms=5000
pos.fiscal.retry.max-backoff-ms=300000
pos.fiscal.retry.poll-interval-ms=30000

# Abuse protection
pos.rate-limit.enabled=${POS_RATE_LIMIT_ENABLED:true}
pos.rate-limit.requests-per-second=${POS_RATE_LIMIT_RPS:20}
pos.rate-limit.auth-requests-per-second=${POS_RATE_LIMIT_AUTH_RPS:5}
