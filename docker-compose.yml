services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${SERVER_PORT:-9090}:9090"
    environment:
      JAVA_TOOL_OPTIONS: -Duser.timezone=${POS_TIMEZONE:-Africa/Nairobi}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-offline}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pos}
      POS_TIMEZONE: ${POS_TIMEZONE:-Africa/Nairobi}
      POS_ALLOWED_ORIGINS: ${POS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      POS_SESSION_COOKIE_SECURE: ${POS_SESSION_COOKIE_SECURE:-false}
      POS_SESSION_COOKIE_SAME_SITE: ${POS_SESSION_COOKIE_SAME_SITE:-strict}
      POS_SESSION_IDLE_TIMEOUT: ${POS_SESSION_IDLE_TIMEOUT:-30m}
      POS_SESSION_ABSOLUTE_TIMEOUT: ${POS_SESSION_ABSOLUTE_TIMEOUT:-12h}
      POS_SEED_DEMO_ENABLED: ${POS_SEED_DEMO_ENABLED:-false}
      POS_SYNC_MODE: ${POS_SYNC_MODE:-local}
      POS_SYNC_CENTRAL_URL: ${POS_SYNC_CENTRAL_URL:-http://host.docker.internal:9090}
      POS_SYNC_POLL_INTERVAL_SECONDS: ${POS_SYNC_POLL_INTERVAL_SECONDS:-30}
      POS_FEATURES_FISCAL: ${POS_FEATURES_FISCAL:-false}
      POS_FISCAL_ENABLED: ${POS_FISCAL_ENABLED:-false}
      POS_FEATURES_DEVICES: ${POS_FEATURES_DEVICES:-false}
      POS_FEATURES_EMAIL: ${POS_FEATURES_EMAIL:-false}
      POS_FEATURES_SMS: ${POS_FEATURES_SMS:-false}
      POS_SALES_RETURN_WINDOW_DAYS: ${POS_SALES_RETURN_WINDOW_DAYS:-7}
      POS_RATE_LIMIT_ENABLED: ${POS_RATE_LIMIT_ENABLED:-false}
      POS_RATE_LIMIT_RPS: ${POS_RATE_LIMIT_RPS:-20}
      POS_RATE_LIMIT_AUTH_RPS: ${POS_RATE_LIMIT_AUTH_RPS:-5}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pos_data:/app/pos-data
      - connectors_data:/connectors
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["messaging"]
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  pos_data:
  connectors_data:
