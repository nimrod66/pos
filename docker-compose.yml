version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pos
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      POS_SYNC_MODE: online
      # Payment gateways — sandbox test keys (replace for production)
      STRIPE_SECRET_KEY: sk_test_51TvURfB2SyHK5onUZH0lmhlIhGntwwECkmxgwrvJpAWp5NptRHKxC7k4iY91haiVofSUQLvzD8fLnMK7Da17DKbR00pdQAG3dg
      STRIPE_PUBLISHABLE_KEY: pk_test_51TvURfB2SyHK5onURe919SSW88qJBwIPNeHYBnp173sU5mhBpg4xikHW8qgMYY7gzRhiJXONbmTUFRzmfn7wu5Ap006aClwITa
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      PAYSTACK_SECRET_KEY: sk_test_259754a18576f005cffa3d50146487761a923ab3
      PAYSTACK_PUBLIC_KEY: pk_test_680dee8c2f914dde8471f40a428936bc704eead7
      MPESA_CONSUMER_KEY: eUH72pO5oOtMIzGAsyAGlcOGlpUEILZGGYVSWEGzidq8pVGs
      MPESA_CONSUMER_SECRET: dFnZAIxGGIdYA0bhKrmO1FZPkyG2IHQ2GhNGYGqIKFfMS2X6lzTxOCglWEiA9Eqq
      MPESA_PASSKEY: bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919
      # Compliance
      FISCAL_MODE: LOCAL
      FISCAL_API_KEY: change-me
      COMPLIANCE_MODE: MOCK
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - pos_data:/pos-data
      - connectors_data:/app/connectors
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mysql_data:
  pos_data:
  connectors_data:
